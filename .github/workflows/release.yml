name: Release build

# Started by hand (Actions -> Release build -> Run workflow, enter the version, e.g. 1.0.22): builds all packages with release.ps1
# and attaches them to a DRAFT release. Nothing becomes public until you press "Publish" on GitHub.
# (Releases are normally built on the developer's computer; this is the fallback that needs no local setup.)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.0.22"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build all packages
        shell: pwsh
        run: ./release.ps1 -Version "${{ inputs.version }}"
      - name: Draft release with the files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: true
          files: release/*
