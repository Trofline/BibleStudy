# Builds the iPhone app (an unsigned .ipa) for a release and attaches it to it.
# There is no Apple developer account behind it: SideStore signs the app on the phone with the person's own (free) Apple ID.
# It runs only when you start it by hand (Actions tab -> "iPhone app (IPA)" -> Run workflow, enter the tag of an existing release,
# e.g. ios-beta-1.9.2), never for pull requests, pushes or tags, so no foreign code is run with the repository's token. Like the other workflows here.
name: iPhone app (IPA)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag the IPA is attached to (the program of this tag is built), e.g. ios-beta-1.9.2. \"test\" = a trial build of the branch in ref: the IPA stays with the run (Artifacts), no release is touched"
        required: true
      ref:
        description: "Branch or tag to build (empty = the tag above). For trying a fix before the tag is moved."
        required: false
      xcode:
        description: "Xcode to use, e.g. 26.0 (empty = the newest installed on the runner)"
        required: false
      fast:
        description: "true = test build: the program is interpreted instead of compiled ahead of time (much faster to build, a bit slower on the phone)"
        required: false
      widget:
        description: "false = without the widget extension (lock screen and home screen widgets); it takes one more app of the 3 that a free Apple ID allows"
        required: false

permissions:
  contents: write   # needed only to attach the file to the release

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Use the .NET 10 SDK
        # the runner image comes with a newer SDK that would be picked first; its iOS tools do not build this .NET 10 app
        run: |
          SDK=$(dotnet --list-sdks | grep '^10\.' | sort -V | tail -1 | cut -d' ' -f1)
          dotnet new globaljson --sdk-version "$SDK" --roll-forward latestFeature --force
          dotnet --version

      - name: Choose Xcode
        run: |
          ls -d /Applications/Xcode*
          # .NET for iOS needs the Xcode it was made for (26.6 for the 26.5.10318 workload installed below)
          WANT="${{ github.event.inputs.xcode }}"; WANT="${WANT:-26.6}"
          APP=/Applications/Xcode_$WANT.app
          [ -d "$APP" ] || APP=$(ls -d /Applications/Xcode_$WANT*.app 2>/dev/null | sort -V | tail -1)
          [ -d "$APP" ] || APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $APP"
          sudo xcode-select -s "$APP/Contents/Developer"
          xcodebuild -version
          # some Xcode copies on the runner lack the plain "MacOSX.sdk" name that the build tools ask for
          SDKS="$APP/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          ls -la "$SDKS" || true
          if [ ! -e "$SDKS/MacOSX.sdk" ]; then
            NEW=$(ls -d "$SDKS"/MacOSX*.sdk 2>/dev/null | sort -V | tail -1)
            [ -n "$NEW" ] && sudo ln -s "$NEW" "$SDKS/MacOSX.sdk"
          fi
          ls -d "$APP"/Contents/Developer/Platforms/*.platform
          xcrun -find install_name_tool
          xcrun --sdk iphoneos -find clang
          xcrun -sdk "$SDKS/MacOSX.sdk" -find clang || true
          xcodebuild -sdk "$SDKS/MacOSX.sdk" -find clang || true

      - name: Install the iOS workload
        run: |
          # the newest workload wants the newest Xcode, which the runner does not have yet: a version made for Xcode 26.6
          echo '{"microsoft.net.sdk.ios": "26.5.10318/10.0.100"}' > rollback.json
          dotnet workload install ios --from-rollback-file rollback.json
          dotnet workload list

      - name: Build the app (unsigned)
        env:
          FASTIN: ${{ github.event.inputs.fast }}
        run: |
          FAST=""; [ "$FASTIN" = "true" ] && FAST="-p:UseInterpreter=true -p:MtouchInterpreter=all"
          VERSION="${TAG##*-}"; VERSION="${VERSION#v}"; [ "$TAG" = "test" ] && VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' src/BibleStudy.iOS/BibleStudy.iOS.csproj | head -1)
          dotnet build src/BibleStudy.iOS/BibleStudy.iOS.csproj -c Release -r ios-arm64 \
            -p:EnableCodeSigning=false -p:ApplicationDisplayVersion=$VERSION -p:Version=$VERSION $FAST -v:n
          APP=$(find src/BibleStudy.iOS/bin/Release -name "*.app" -maxdepth 6 -type d | head -1)
          echo "App folder: $APP"
          test -n "$APP"

      - name: Build the widget extension
        # WidgetKit widgets need an extension written in Swift: it is built here with Xcode and put into the app (PlugIns/BibleStudyWidget.appex).
        # Both get an ad-hoc signature carrying their entitlements (the shared app group): SideStore reads the entitlements from there when it
        # signs the app with the Apple ID, and registers the group for it.
        if: github.event.inputs.widget != 'false'
        run: |
          APP=$(find src/BibleStudy.iOS/bin/Release -name "*.app" -maxdepth 6 -type d | head -1)
          SRC=src/BibleStudy.iOS/Widget
          EXT="$APP/PlugIns/BibleStudyWidget.appex"
          rm -rf "$EXT" && mkdir -p "$EXT"
          # a real Xcode build of the extension (XcodeGen writes the project from Widget/project.yml)
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec "$SRC/project.yml" --project "$SRC"
          xcodebuild -project "$SRC/BibleStudyWidget.xcodeproj" -target BibleStudyWidget -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/widget-build" build
          BUILT="$PWD/widget-build/Release-iphoneos/BibleStudyWidget.appex"
          test -d "$BUILT"
          rm -rf "$EXT" && cp -R "$BUILT" "$EXT"
          # the extension carries the version numbers of the app
          SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SHORT" -c "Set :CFBundleVersion $BUILD" "$EXT/Info.plist"
          plutil -lint "$EXT/Info.plist"
          plutil -p "$EXT/Info.plist"
          otool -l "$EXT/BibleStudyWidget" | grep -A4 -E "LC_BUILD_VERSION|LC_MAIN" || true
          # sign from the inside out: everything ad hoc, then the extension and the app again with their entitlements
          codesign --force --deep --sign - "$APP"
          codesign --force --sign - --entitlements "$SRC/Widget.entitlements" --generate-entitlement-der "$EXT"
          codesign --force --sign - --entitlements "$SRC/App.entitlements" --generate-entitlement-der "$APP"
          codesign -d --entitlements - "$EXT"
          codesign -d --entitlements - "$APP"
          ls -la "$EXT"

      - name: Pack the IPA
        run: |
          VERSION="${TAG##*-}"; VERSION="${VERSION#v}"; [ "$TAG" = "test" ] && VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' src/BibleStudy.iOS/BibleStudy.iOS.csproj | head -1)
          APP=$(find src/BibleStudy.iOS/bin/Release -name "*.app" -maxdepth 6 -type d | head -1)
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/BibleStudy.app
          (cd ipa && zip -qry "../BibleStudy-iOS-$VERSION.ipa" Payload)
          shasum -a 256 "BibleStudy-iOS-$VERSION.ipa" | tee "BibleStudy-iOS-$VERSION.ipa.sha256"
          ls -la BibleStudy-iOS-*.ipa

      - name: Keep the trial IPA with the run
        if: github.event.inputs.tag == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: BibleStudy-iOS-test
          path: BibleStudy-iOS-*.ipa

      - name: Attach to the release
        if: github.event.inputs.tag != 'test'
        run: gh release upload "$TAG" BibleStudy-iOS-*.ipa BibleStudy-iOS-*.ipa.sha256 --clobber
